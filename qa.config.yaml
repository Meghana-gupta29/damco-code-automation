# Target application (the open-source repo under test)
target:
  repo_path: ../full-stack-fastapi-template
  api_url: http://localhost:8000
  ui_url: http://localhost:5173
  fork_repo: Meghana-gupta29/damco-code-opensource   # PR target
  base_branch: master

# Which LLM runs the agents. "claude_code" = local `claude -p` (no API key).
# Later: "anthropic" (needs ANTHROPIC_API_KEY) for server/CI hosting.
llm:
  provider: claude_code
  claude_code:
    command: claude
    timeout_s: 600
  anthropic:
    model: claude-sonnet-5-5

# Human-in-the-loop gates. "cli" = terminal approve; later "pipeline".
gates:
  mode: cli

# Reports are sent to the local Mailpit started with the app (inbox: http://localhost:8025).
# To use a real SMTP server later, change host/port and set tls/user/password via .env.
email:
  from: qa-orchestrator@example.com
  to: qa-lead@example.com
  smtp_host: localhost
  smtp_port: 1025
  tls: false
  inbox_url: http://localhost:8025

# Test users created by the generated tests are deleted at the end of every run.
# Only emails matching these strict patterns are removed; superusers are never touched.
cleanup:
  test_user_email_patterns:
    - '^(qa|ghost|login|user)_[0-9a-f]{12}@example\.com$'
    - '^qaui_\d+_\d+@example\.com$'

paths:
  runs_dir: runs
