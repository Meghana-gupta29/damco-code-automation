[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-orchestrator"
version = "0.1.0"
description = "Agentic QA workflow: plan -> human review -> generate -> execute -> triage -> report -> PR"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "python-dotenv>=1", "jsonschema>=4", "pytest>=8", "httpx>=0.27"]

[project.scripts]
qa = "qa.cli:main"

[tool.setuptools.packages.find]
include = ["qa*"]
